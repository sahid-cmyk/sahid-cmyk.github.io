<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahid Exsome | Visual Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #070708;
            --text-main: #f0f0f0;
            --text-muted: #737373;
            --accent: #ffffff;
            --border: #1a1a1a;
        }

        /* --- SMOOTH SCROLL (LENIS) FIXES --- */
        html.lenis, html.lenis body { height: auto; width: 100%; overflow-x: hidden; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }
        .lenis.lenis-scrolling iframe { pointer-events: none; }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* --- EFECTOS DE FONDO PREMIUM (Cinematic) --- */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999; opacity: 0.04; 
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        .ambient-glow {
            position: fixed; top: -10%; left: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(25, 25, 35, 0.6) 0%, rgba(7, 7, 8, 0) 70%);
            border-radius: 50%; filter: blur(90px); z-index: -1;
            animation: floatGlow 15s infinite alternate ease-in-out;
            will-change: transform;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15vw, 10vh) scale(1.2); }
        }

        /* --- HERO EDITORIAL --- */
        header {
            min-height: 85vh; display: flex; flex-direction: column; justify-content: center;
            padding: 0 12vw; border-bottom: 1px solid var(--border);
            position: relative; z-index: 1;
        }

        .role-tag {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 4px;
            color: var(--text-muted); margin-bottom: 2rem; display: flex; align-items: center; gap: 10px;
        }
        .role-tag::before { content: ""; display: block; width: 30px; height: 1px; background-color: var(--text-muted); }
